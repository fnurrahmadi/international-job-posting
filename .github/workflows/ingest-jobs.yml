name: Ingest jobs

on:
  workflow_dispatch:
    inputs:
      full_maintenance:
        description: "Reclassify all active jobs in addition to normal ingestion"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 19 * * *"

concurrency:
  group: daily-job-ingestion
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm ingest
        env:
          INGEST_CONCURRENCY: "4"
      - name: Reclassify existing jobs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_maintenance }}
        run: pnpm jobs:reclassify
      - name: Check application links weekly
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%u)" = "7" ]; then
            pnpm jobs:check-links
          else
            echo "Skipping link check; it runs on Sundays or manual executions."
          fi
        env:
          LINK_CHECK_LIMIT: "100"
      - run: pnpm alerts:send
