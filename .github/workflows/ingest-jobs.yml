name: Ingest jobs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/companies.json"
      - "scripts/**"
      - "sql/**"
      - "src/lib/ats/**"
      - "src/lib/ingestion/**"
      - "src/lib/jobs/**"
      - ".github/workflows/ingest-jobs.yml"
  schedule:
    - cron: "17 19 * * *"

concurrency:
  group: daily-job-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm ingest
        env:
          INGEST_CONCURRENCY: "4"
      - run: pnpm jobs:check-links
        env:
          LINK_CHECK_LIMIT: "100"
      - run: pnpm alerts:send
